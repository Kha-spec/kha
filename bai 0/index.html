<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberChess Master - Cờ Vua Đỉnh Cao</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Canvas hạt nền & hiệu ứng va chạm FX -->
  <canvas id="fx-canvas"></canvas>

  <div class="game-container">
    <!-- Cột bên trái: Thông tin người chơi & Bàn cờ -->
    <main class="board-section">
      <!-- Player Top (Đen / Máy) -->
      <div class="player-bar top-player" id="player-black-bar">
        <div class="player-info">
          <div class="avatar black-avatar">
            <span class="avatar-icon" id="black-avatar-icon">🤖</span>
            <div class="turn-indicator" id="indicator-black"></div>
          </div>
          <div class="player-meta">
            <h3 class="player-name" id="name-black">Cyber AI (Cấp 2)</h3>
            <div class="captured-box" id="captured-by-black"></div>
          </div>
        </div>
        <div class="timer-box" id="timer-black">10:00</div>
      </div>

      <!-- Bàn cờ chính -->
      <div class="board-wrapper">
        <div class="board-glow-frame">
          <div id="board" class="chess-board"></div>
        </div>
        
        <!-- Bảng thông báo chiếu / kết thúc -->
        <div id="alert-banner" class="alert-banner hidden">
          <span id="alert-text">CHIẾU TƯỚNG!</span>
        </div>
      </div>

      <!-- Player Bottom (Trắng / Bạn) -->
      <div class="player-bar bottom-player" id="player-white-bar">
        <div class="player-info">
          <div class="avatar white-avatar">
            <span class="avatar-icon">👑</span>
            <div class="turn-indicator active" id="indicator-white"></div>
          </div>
          <div class="player-meta">
            <h3 class="player-name" id="name-white">Chỉ Huy (Trắng)</h3>
            <div class="captured-box" id="captured-by-white"></div>
          </div>
        </div>
        <div class="timer-box active" id="timer-white">10:00</div>
      </div>
    </main>

    <!-- Cột bên phải: Bảng điều khiển, Lịch sử, Cài đặt -->
    <aside class="control-panel">
      <header class="panel-header">
        <div class="logo">
          <span class="logo-neon">CYBER</span>CHESS
        </div>
        <div class="status-badge" id="game-status-badge">LƯỢT CỦA BẠN</div>
      </header>

      <!-- Thanh chọn chế độ chơi -->
      <div class="card mode-card">
        <div class="mode-selector">
          <button class="mode-btn active" id="btn-vs-ai">🤖 Đấu với AI</button>
          <button class="mode-btn" id="btn-vs-human">👥 2 Người chơi</button>
        </div>
        <div class="ai-difficulty-wrapper" id="ai-diff-wrapper">
          <label for="ai-level">Độ khó AI:</label>
          <div class="diff-buttons">
            <button class="diff-btn" data-level="1">Tân Binh</button>
            <button class="diff-btn active" data-level="2">Chiến Binh</button>
            <button class="diff-btn" data-level="3">Đại Sư</button>
          </div>
        </div>
      </div>

      <!-- Lịch sử nước đi -->
      <div class="card moves-card">
        <div class="card-title">
          <span>📜 Lịch Sử Nước Đi</span>
          <span class="move-count" id="move-count">0 nước</span>
        </div>
        <div class="moves-list-container" id="moves-history">
          <!-- Các cặp nước đi sẽ xuất hiện tại đây -->
        </div>
      </div>

      <!-- Thanh công cụ điều khiển -->
      <div class="actions-grid">
        <button class="action-btn primary" id="btn-new-game">
          <span class="btn-icon">⚡</span> Ván Mới
        </button>
        <button class="action-btn" id="btn-undo">
          <span class="btn-icon">↩</span> Đi Lại
        </button>
        <button class="action-btn" id="btn-flip">
          <span class="btn-icon">🔄</span> Đổi Góc
        </button>
        <button class="action-btn" id="btn-fullscreen">
          <span class="btn-icon" id="fullscreen-icon">⛶</span> Toàn Màn
        </button>
        <button class="action-btn" id="btn-sound-toggle">
          <span class="btn-icon" id="sound-icon">🔊</span> Âm Thanh
        </button>
      </div>

      <!-- Thông tin thế cờ / Đánh giá ưu thế -->
      <div class="eval-bar-wrapper">
        <div class="eval-labels">
          <span>Trắng <span id="white-adv">+0</span></span>
          <span>Đen <span id="black-adv">+0</span></span>
        </div>
        <div class="eval-progress">
          <div class="eval-white" id="eval-fill" style="width: 50%;"></div>
        </div>
      </div>
    </aside>
  </div>

  <!-- Modal phong cấp tốt (Pawn Promotion) -->
  <div id="promotion-modal" class="modal-overlay hidden">
    <div class="modal-content promotion-box">
      <h2>CHỌN QUÂN PHONG CẤP</h2>
      <p>Tốt đã tới hàng cuối, hãy chọn binh chủng mới:</p>
      <div class="promotion-choices" id="promotion-choices">
        <!-- Chứa quân Hậu, Xe, Tượng, Mã -->
      </div>
    </div>
  </div>

  <!-- Modal kết thúc ván đấu -->
  <div id="gameover-modal" class="modal-overlay hidden">
    <div class="modal-content gameover-box">
      <div class="victory-icon" id="go-icon">🏆</div>
      <h2 id="go-title">CHIẾN THẮNG TUYỆT ĐỐI!</h2>
      <p id="go-desc">Bên Trắng đã chiếu bí đối thủ.</p>
      <div class="gameover-actions">
        <button class="action-btn primary" id="btn-go-replay">Chơi Ván Mới</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="audio.js"></script>
  <script src="particles.js"></script>
  <script src="chess-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
